<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>옛말샘 · 사자성어와 속담 바로 찾기</title>
<meta name="description" content="초·중·고에서 많이 쓰는 사자성어와 속담을 뜻, 한자, 예문과 함께 찾아보는 사전">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Serif+KR:wght@500;600;800&display=swap">
<style>
:root{
  --bg:#F2F6F5; --surface:#FFFFFF; --ink:#12262B; --muted:#4D6267; --line:#D3DFDE;
  --sa:#2F4399; --sa-soft:#E7EBF9;
  --sok:#A65A0A; --sok-soft:#FBECD8;
  --focus:#1B6EF3;
  --serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --sans:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1B1E; --surface:#17272B; --ink:#E6F0EE; --muted:#A3B8B6; --line:#2A3F43;
    --sa:#A9B8FF; --sa-soft:#1F2A57;
    --sok:#F2B672; --sok-soft:#3B2A14;
    --focus:#7FB0FF;
  }
}
.t-sa{--c:var(--sa);--cs:var(--sa-soft)}
.t-sok{--c:var(--sok);--cs:var(--sok-soft)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.65}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* 머리글 */
.top{padding:28px 0 12px}
.brand{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px}
.brand h1{margin:0;font-family:var(--serif);font-weight:800;font-size:clamp(30px,6vw,42px);letter-spacing:-.02em;line-height:1.2}
.brand p{margin:0;color:var(--muted)}
.search{position:relative;margin-top:16px}
.search input{width:100%;font:inherit;font-size:18px;padding:14px 48px 14px 18px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);appearance:none}
.search input::placeholder{color:var(--muted);opacity:.85}
.search input:focus-visible{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 30%,transparent)}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer;display:none}
.search.has-q .clear{display:block}

.filters{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:14px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 16px;cursor:pointer;min-height:42px}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;min-height:42px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}

/* 본문 레이아웃 */
.layout{display:grid;grid-template-columns:1fr;gap:28px;padding:8px 0 56px}
.count{margin:18px 0 8px;color:var(--muted);font-size:15px}

/* 목록 행 */
.rows{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{display:grid;grid-template-columns:6px 1fr;background:var(--surface);border:2px solid var(--line);border-radius:12px;overflow:hidden}
.row:hover{border-color:var(--c)}
.row[aria-current="true"]{border-color:var(--c);background:var(--cs)}
.row::before{content:"";background:var(--c)}
.row .in{padding:10px 14px;min-width:0}
.row .w{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px}
.row .word{font-family:var(--serif);font-weight:600;font-size:18px;line-height:1.4}
.row .hanja{font-family:var(--serif);color:var(--c);font-size:16px}
.row .lv{margin-left:auto;font-size:13px;color:var(--muted)}
.row .mean{margin:0;color:var(--muted);font-size:15px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more{display:block;margin:14px auto 0;padding:10px 22px;border:2px solid var(--line);background:var(--surface);border-radius:999px;cursor:pointer}
.empty{padding:28px 4px;color:var(--muted)}

/* 오늘의 말 */
.today{margin:20px 0 4px;display:grid;gap:12px}
.today h2{margin:0;font-size:16px;color:var(--muted);font-weight:400}
.tcard{display:block;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:18px 18px 16px}
.tcard:hover{border-color:var(--c)}
.tcard .meaning{margin:12px 0 0;color:var(--ink)}
.tcard .pv{font-family:var(--serif);font-weight:600;font-size:clamp(20px,4.6vw,24px);line-height:1.5;margin:0}

/* 한자 칸 */
.hj{display:flex;flex-wrap:wrap;gap:10px 8px}
.hj-cell{display:flex;flex-direction:column;align-items:center;gap:4px}
.hj-box{--g:color-mix(in srgb,var(--c) 28%,transparent);
  width:var(--cell,56px);height:var(--cell,56px);display:grid;place-items:center;
  border:2px solid var(--c);border-radius:6px;background-color:var(--surface);
  background-image:
    linear-gradient(to right,transparent calc(50% - .5px),var(--g) calc(50% - .5px),var(--g) calc(50% + .5px),transparent calc(50% + .5px)),
    linear-gradient(to bottom,transparent calc(50% - .5px),var(--g) calc(50% - .5px),var(--g) calc(50% + .5px),transparent calc(50% + .5px));
  font-family:var(--serif);font-weight:600;font-size:calc(var(--cell,56px)*.62);line-height:1;color:var(--ink)}
.hj-rd{font-size:15px;color:var(--c);font-weight:700}
.hj.lg{--cell:clamp(52px,13.5vw,76px)}

/* 상세 */
.detail{display:none}
.detail.open{display:block;position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.dwrap{max-width:720px;margin:0 auto;padding:16px 20px 64px}
.back{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;min-height:42px;cursor:pointer}
.dhead{margin:20px 0 0}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.badge{display:inline-block;background:var(--cs);color:var(--c);font-weight:700;border-radius:999px;padding:2px 12px;font-size:15px}
.lvtag{color:var(--muted);font-size:15px}
.dtitle{font-family:var(--serif);font-weight:800;font-size:clamp(26px,6vw,34px);line-height:1.4;margin:0;letter-spacing:-.01em}
.dtitle:focus{outline:none}
.sec{margin-top:26px}
.sec h3{margin:0 0 6px;font-size:16px;color:var(--c,var(--muted))}
.sec p{margin:0}
.ex{border-left:4px solid var(--c);padding:2px 0 2px 14px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.tag{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 12px;font-size:15px;cursor:pointer;min-height:36px}
.rel{margin-top:34px;padding-top:6px;border-top:2px solid var(--line)}
.rel h3{margin:18px 0 8px;font-size:17px}
.rel .sub{font-weight:400;color:var(--muted);font-size:14px;margin-left:6px}

.foot{border-top:2px solid var(--line);padding:18px 0 40px;color:var(--muted);font-size:14px}
.err{margin:24px 0;padding:18px;border:2px solid var(--sok);border-radius:12px;background:var(--sok-soft)}

@media (min-width:900px){
  .layout{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:36px;align-items:start}
  .detail{display:block;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;
    background:var(--surface);border:2px solid var(--line);border-radius:18px;animation:none}
  .detail.open{position:sticky;inset:auto;z-index:auto;background:var(--surface);animation:none}
  .dwrap{padding:24px 28px 36px;max-width:none}
  .back{display:none}
  .dhead{margin-top:0}
  .detail .ph{padding:40px 28px;color:var(--muted)}
  body.lock{overflow:auto}
}
@media (max-width:899px){ .detail .ph{display:none} }
@media (prefers-reduced-motion:reduce){ .detail.open{animation:none} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>옛말샘</h1>
      <p>사자성어와 속담, 뜻까지 바로 찾기</p>
    </div>
    <div class="search" id="searchBox">
      <label class="sr-only" for="q">검색</label>
      <input id="q" type="search" inputmode="search" autocomplete="off" enterkeyhint="search"
             placeholder="뜻, 한자, 초성으로 찾기 (예: ㅇㅅㅇㅈ)">
      <button class="clear" id="clear" type="button" aria-label="검색어 지우기">×</button>
    </div>
    <div class="filters">
      <div class="seg" role="group" aria-label="종류" id="segType">
        <button type="button" data-v="all" aria-pressed="true">전체</button>
        <button type="button" data-v="사자성어" aria-pressed="false">사자성어</button>
        <button type="button" data-v="속담" aria-pressed="false">속담</button>
      </div>
      <div class="chips" role="group" aria-label="학년" id="chipLevel">
        <button class="chip" type="button" data-v="all" aria-pressed="true">모든 학년</button>
        <button class="chip" type="button" data-v="초저" aria-pressed="false">초등 저</button>
        <button class="chip" type="button" data-v="초고" aria-pressed="false">초등 고</button>
        <button class="chip" type="button" data-v="중" aria-pressed="false">중학</button>
        <button class="chip" type="button" data-v="고" aria-pressed="false">고등</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <section id="listPane" aria-label="목록">
      <div id="today"></div>
      <p class="count" id="count" aria-live="polite"></p>
      <ul class="rows" id="rows"></ul>
      <button class="more" id="more" type="button" hidden>더 보기</button>
      <div id="msg"></div>
    </section>
    <aside class="detail" id="detail" aria-label="상세"></aside>
  </main>

  <footer class="foot" id="foot"></footer>
</div>

<script>
"use strict";
const LEVEL_LABEL = {"초저":"초등 저","초고":"초등 고","중":"중학","고":"고등"};
const PAGE = 60;
const CHO = [..."ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ"];
const isCho = c => CHO.includes(c);
const cho = c => { const n = c.charCodeAt(0) - 0xAC00; return (n >= 0 && n < 11172) ? CHO[Math.floor(n / 588)] : c; };
const esc = s => String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const norm = s => String(s).replace(/\s+/g, "").toLowerCase();
const tcls = it => it.type === "사자성어" ? "t-sa" : "t-sok";

let DATA = [], BY_ID = {};
const state = { q: "", type: "all", level: "all", limit: PAGE };
const $ = id => document.getElementById(id);

/* 검색: 표제어는 초성/글자 혼합 패턴 매칭 */
function matchWord(word, q) {
  if (!q) return -1;
  for (let i = 0; i + q.length <= word.length; i++) {
    let ok = true;
    for (let j = 0; j < q.length; j++) {
      const qc = q[j], wc = word[i + j];
      if (qc !== wc && !(isCho(qc) && cho(wc) === qc)) { ok = false; break; }
    }
    if (ok) return i;
  }
  return -1;
}
function score(it, q) {
  const w = it._w;
  const pos = matchWord(w, q);
  if (pos === 0 && w.length === q.length) return 120;
  if (pos === 0) return 100;
  if (pos > 0) return 80;
  if (it._h && it._h.includes(q)) return 90;
  if (it._t.includes(q)) return 50;
  if (it._m.includes(q)) return 40;
  return 0;
}
function filtered() {
  const q = norm(state.q);
  let out = DATA.filter(it =>
    (state.type === "all" || it.type === state.type) &&
    (state.level === "all" || it.level === state.level));
  if (!q) return out;
  return out
    .map((it, i) => [it, score(it, q), i])
    .filter(x => x[1] > 0)
    .sort((a, b) => b[1] - a[1] || a[2] - b[2])
    .map(x => x[0]);
}

/* 연관 보기: 유의 → 반의 → 같은 주제(태그) */
function related(it) {
  const used = new Set([it.id, ...it.synonyms, ...it.antonyms]);
  const mine = new Set(it.tags);
  const cand = [];
  for (const o of DATA) {
    if (used.has(o.id)) continue;
    const shared = o.tags.filter(t => mine.has(t)).length;
    if (shared) cand.push([o, shared + (o.type !== it.type ? 0.5 : 0)]);
  }
  cand.sort((a, b) => b[1] - a[1]);
  return {
    syn: it.synonyms.map(i => BY_ID[i]).filter(Boolean),
    ant: it.antonyms.map(i => BY_ID[i]).filter(Boolean),
    same: cand.slice(0, 5).map(x => x[0])
  };
}

/* 조각 렌더 */
function hanjaCells(it, large) {
  const hs = [...it.hanja], ws = [...it.word];
  return `<div class="hj ${large ? "lg" : ""}" aria-hidden="true">` +
    hs.map((h, i) => `<div class="hj-cell"><div class="hj-box">${esc(h)}</div><div class="hj-rd">${esc(ws[i] || "")}</div></div>`).join("") +
    `</div>`;
}
function rowHTML(it) {
  const hj = it.hanja ? `<span class="hanja">${esc(it.hanja)}</span>` : "";
  return `<li><a class="row ${tcls(it)}" href="#${it.id}" data-id="${it.id}">
    <span class="in"><span class="w"><span class="word">${esc(it.word)}</span>${hj}<span class="lv">${esc(LEVEL_LABEL[it.level] || "")}</span></span>
    <p class="mean">${esc(it.meaning)}</p></span></a></li>`;
}
function relBlock(title, sub, list) {
  if (!list.length) return "";
  return `<h3>${esc(title)}${sub ? `<span class="sub">${esc(sub)}</span>` : ""}</h3><ul class="rows">${list.map(rowHTML).join("")}</ul>`;
}

/* 목록 */
function renderList() {
  const list = filtered();
  const shown = list.slice(0, state.limit);
  $("rows").innerHTML = shown.map(rowHTML).join("");
  $("more").hidden = list.length <= shown.length;
  $("count").textContent = list.length ? `${list.length}개` : "";
  $("msg").innerHTML = list.length ? "" :
    `<p class="empty">‘${esc(state.q)}’에 맞는 말이 없어요. 초성(예: ㅇㅅㅇㅈ)이나 한자로도 찾아보세요.</p>`;
  const home = !norm(state.q) && state.type === "all" && state.level === "all";
  $("today").innerHTML = home ? todayHTML() : "";
  markActive();
}
function todayHTML() {
  const d = new Date();
  const day = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
  const sa = DATA.filter(x => x.type === "사자성어");
  const sok = DATA.filter(x => x.type === "속담");
  if (!sa.length || !sok.length) return "";
  const a = sa[day % sa.length], b = sok[day % sok.length];
  return `<div class="today"><h2>오늘의 말</h2>
    <a class="tcard ${tcls(a)}" href="#${a.id}">${hanjaCells(a, true)}<p class="meaning">${esc(a.meaning)}</p></a>
    <a class="tcard ${tcls(b)}" href="#${b.id}"><p class="pv">${esc(b.word)}</p><p class="meaning">${esc(b.meaning)}</p></a></div>`;
}

/* 상세 */
function renderDetail(it) {
  const box = $("detail");
  const r = related(it);
  const head = it.type === "사자성어"
    ? `<h2 class="sr-only dtitle" tabindex="-1" id="dt">${esc(it.word)} (${esc(it.hanja)})</h2>${hanjaCells(it, true)}`
    : `<h2 class="dtitle" tabindex="-1" id="dt">${esc(it.word)}</h2>`;
  box.className = "detail open " + tcls(it);
  box.innerHTML = `<div class="dwrap">
    <button class="back" type="button" id="back">← 목록</button>
    <div class="dhead">
      <div class="meta"><span class="badge">${esc(it.type)}</span><span class="lvtag">${esc(LEVEL_LABEL[it.level] || "")}</span></div>
      ${head}
    </div>
    <div class="sec"><h3>뜻</h3><p>${esc(it.meaning)}</p></div>
    ${it.example ? `<div class="sec"><h3>예문</h3><p class="ex">${esc(it.example)}</p></div>` : ""}
    ${it.origin ? `<div class="sec"><h3>유래</h3><p>${esc(it.origin)}</p></div>` : ""}
    ${it.tags.length ? `<div class="tags">${it.tags.map(t => `<button type="button" class="tag" data-tag="${esc(t)}">#${esc(t)}</button>`).join("")}</div>` : ""}
    ${(r.syn.length || r.ant.length || r.same.length) ? `<div class="rel">
      ${relBlock("비슷한 표현", "뜻이 가까운 말", r.syn)}
      ${relBlock("반대되는 표현", "", r.ant)}
      ${relBlock("같이 보면 좋은 말", "주제가 같은 말", r.same)}
    </div>` : ""}</div>`;
  box.scrollTop = 0;
  if (matchMedia("(max-width:899px)").matches) {
    document.body.classList.add("lock");
    $("dt").focus({ preventScroll: true });
  }
  markActive();
}
function placeholder() {
  const box = $("detail");
  box.className = "detail";
  box.innerHTML = `<p class="ph">목록에서 말을 고르면 뜻과 한자, 비슷한 표현이 여기에 나와요.</p>`;
  document.body.classList.remove("lock");
}
function markActive() {
  const id = location.hash.slice(1);
  document.querySelectorAll("#rows .row").forEach(a => {
    if (a.dataset.id === id) a.setAttribute("aria-current", "true"); else a.removeAttribute("aria-current");
  });
}
function route() {
  const it = BY_ID[location.hash.slice(1)];
  if (it) renderDetail(it); else placeholder();
  markActive();
}
function closeDetail() {
  history.replaceState(null, "", location.pathname + location.search);
  route();
}

/* 이벤트 */
function setPressed(group, v) {
  group.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
}
function update() {
  state.limit = PAGE;
  $("searchBox").classList.toggle("has-q", !!state.q);
  renderList();
}
$("q").addEventListener("input", e => { state.q = e.target.value; update(); });
$("clear").addEventListener("click", () => { state.q = ""; $("q").value = ""; update(); $("q").focus(); });
$("segType").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.type = b.dataset.v; setPressed($("segType"), state.type); update();
});
$("chipLevel").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.level = b.dataset.v; setPressed($("chipLevel"), state.level); update();
});
$("more").addEventListener("click", () => { state.limit += PAGE; renderList(); });
$("detail").addEventListener("click", e => {
  if (e.target.closest("#back")) { closeDetail(); return; }
  const t = e.target.closest(".tag");
  if (t) {
    state.q = t.dataset.tag; $("q").value = state.q;
    state.type = "all"; state.level = "all";
    setPressed($("segType"), "all"); setPressed($("chipLevel"), "all");
    closeDetail(); update(); window.scrollTo({ top: 0 });
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && location.hash.length > 1) closeDetail();
});
window.addEventListener("hashchange", route);

/* 시작 */
fetch("data.json")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(rows => {
    DATA = rows.map(it => Object.assign({}, it, {
      _w: norm(it.word), _h: it.hanja || "", _m: norm(it.meaning), _t: norm(it.tags.join(""))
    }));
    DATA.forEach(it => BY_ID[it.id] = it);
    const ns = DATA.filter(x => x.type === "사자성어").length;
    $("foot").textContent = `옛말샘 · 사자성어 ${ns}개 · 속담 ${DATA.length - ns}개`;
    renderList(); route();
  })
  .catch(() => {
    $("msg").innerHTML = `<div class="err"><strong>데이터를 불러오지 못했어요.</strong><br>
      data.json이 index.html과 같은 폴더에 있는지 확인하세요. 내 컴퓨터에서 파일을 직접 열었다면
      폴더에서 <code>python -m http.server</code>를 실행한 뒤 localhost 주소로 열어야 해요.</div>`;
  });
</script>
</body>
</html>
